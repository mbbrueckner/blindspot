[project]
name = "blindspot"
version = "0.1.0"
description = "Obstacle warnings for blind pedestrians from monocular depth estimation"
requires-python = ">=3.12"
# Core: data loaders, metrics and alert logic. Light, this is what CI installs.
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Pretrained depth models (WP 2.1). GitHub-only model packages are documented in docs/models.md.
models = [
    "huggingface-hub>=0.30",
    "mmengine>=0.10",
    "safetensors>=0.4",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
    "ultralytics>=8.4",
]
# Models only available on GitHub that install cleanly into the main environment (pinned commits).
# MoGe, UniDepth and Depth Anything 3 need separate environments, see docs/models.md.
github = ["zipdepth @ git+https://github.com/fabiotosi92/ZipDepth@91f3fd21e131641f51e8d35736d1958350180e3a"]
# Figures and HTML report.
viz = ["matplotlib>=3.9"]
# Fallback video decoder for the iPhone recordings (HEVC) if OpenCV cannot read them.
video = ["av>=14.0"]

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# E/F: PEP 8 and errors, I: import order, D: docstrings (mandatory, Google style)
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
