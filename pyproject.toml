[project]
name = "blindspot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# E/F: PEP 8 and errors, I: import order, D: docstrings (mandatory, Google style)
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
